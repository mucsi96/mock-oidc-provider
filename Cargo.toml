[package]
name = "mock-oidc-provider"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Mock OpenID Connect provider for testing"
license = "MIT"
repository = "https://github.com/mucsi96/mock-oidc-provider"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
